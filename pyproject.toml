[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "train-wagons"
version = "0.1.0"
description = "Optimisation model for planning train wagons (OR-Tools + SCIP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Taras Bulubas", email = "taras.bulubas@gmail.com" }]
license = "LicenseRef-All-Rights-Reserved"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
dependencies = ["ortools>=9.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
train-wagons = "train_wagons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
